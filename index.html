const st=document.getElementById('stage');if(!st)return;
st.querySelectorAll('[data-b]').forEach(el=>{
el.addEventListener('input',()=>{const s=cur();if(!s)return;s.blocks[el.dataset.b]=el.innerHTML;autoSave();});});
}
let saveT=null;function autoSave(){clearTimeout(saveT);saveT=setTimeout(save,600);}
function goSlide(i){syncStage();SI=Math.max(0,Math.min(i,DECK.slides.length-1));renderStage();}
function syncStage(){const s=cur();if(!s)return;const st=document.getElementById('stage');if(!st)return;
st.querySelectorAll('[data-b]').forEach(el=>{s.blocks[el.dataset.b]=el.innerHTML;});
s.notes=document.getElementById('notesIn').value;}
function addSlide(layout){syncStage();snap();DECK.slides.splice(SI+1,0,mkSlide(layout||'bullets'));SI=Math.min(SI+1,DECK.slides.length-1);renderStage();save();}
function dupSlide(){if(!cur())return;syncStage();snap();const c=JSON.parse(JSON.stringify(cur()));c.id=uid();DECK.slides.splice(SI+1,0,c);SI++;renderStage();save();}
function delSlide(){if(!DECK.slides.length)return;syncStage();snap();DECK.slides.splice(SI,1);SI=Math.max(0,SI-1);if(!DECK.slides.length)DECK.slides.push(mkSlide('title'));renderStage();save();}
function moveSlide(d){syncStage();const j=SI+d;if(j<0||j>=DECK.slides.length)return;snap();const [s]=DECK.slides.splice(SI,1);DECK.slides.splice(j,0,s);SI=j;renderStage();save();}
function setLayout(l){if(!cur())return;syncStage();snap();cur().layout=l;renderStage();save();}
function slideBG(v){if(!cur())return;cur().bg=v;renderStage();autoSave();}
function setTheme(v){DECK.theme=v;renderStage();autoSave();}
function setTrans(v){DECK.trans=v;autoSave();}
function buildLaySel(){document.getElementById('laySel').innerHTML=LAYOUTS.map(l=>`<option value="${l}">${t('lay'+l[0].toUpperCase()+l.slice(1))}</option>`).join('');}
function buildThemeSel(){document.getElementById('thSel').innerHTML=Object.keys(THEMES).map(k=>`<option value="${k}">${k}</option>`).join('');document.getElementById('thSel').value=DECK.theme;}
function fmt(c){document.execCommand(c,false,null);document.getElementById('stage').focus();}
function fs(v){document.execCommand('fontSize',false,v);}
function fg(v){document.execCommand('foreColor',false,v);}
function cmdList(ord){document.execCommand(ord?'insertOrderedList':'insertUnorderedList',false,null);}
function insTable(){let h='<table><tbody>';for(let i=0;i<3;i++){h+='<tr>';for(let j=0;j<3;j++)h+='<td>cell</td>';h+='</tr>';}h+='</tbody></table>';document.execCommand('insertHTML',false,h);}
function insImg(el){const f=el.files&&el.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const s=cur();if(!s)return;s.blocks.img=r.result;if(s.layout!=='imageright'){snap();s.layout='imageright';}renderStage();save();};r.readAsDataURL(f);el.value='';}
function toggleTheme(){document.body.classList.toggle('light');}
function findDlg(){const q=prompt('🔍');if(!q)return;const n=(document.getElementById('stage').innerText||'').split(q).length-1;toast(n+' ×');}
function parseOutline(text){
const slides=[];let curS=null;
String(text||'').split('\n').forEach(raw=>{
const line=raw.trim();if(!line)return;
if(line.startsWith('#')){curS={title:line.replace(/^#+\s*/,''),bullets:[]};slides.push(curS);}
else if(/^[-*•]\s+/.test(line)){if(!curS){curS={title:'Untitled',bullets:[]};slides.push(curS);}curS.bullets.push(line.replace(/^[-*•]\s+/,''));}
else{if(!curS||curS.bullets.length){curS={title:line,bullets:[]};slides.push(curS);}else curS.bullets.push(line);}
});
return slides;
}
function suggestLayout(sl){
const n=(sl.bullets||[]).length;
if(sl.img)return 'imageright';
if(n>6)return 'twocol';
if(n===0)return 'section';
if(n===1&&(sl.bullets[0]||'').length<80)return 'quote';
return 'bullets';
}
function expandNotes(sl){
return (sl.bullets||[]).map((b,i)=>`${i+1}. Say: "${b}" — Explain why it matters. Example: ... Takeaway: ...`).join('\n');
}
function aiDo(kind){
const box=document.getElementById('aiOut');
if(kind==='outline'){
const txt=document.getElementById('outlineIn').value;
const parsed=parseOutline(txt);
if(!parsed.length){toast(t('needText'));return;}
syncStage();snap();
parsed.forEach(p=>{const layout=suggestLayout(p);
const s=mkSlide(layout);
s.blocks.title=p.title;
if(layout==='quote')s.blocks.quote=p.bullets[0]||p.title;
else s.blocks.body='<ul>'+p.bullets.map(b=>`<li>${esc(b)}</li>`).join('')+'</ul>';
s.notes=expandNotes(p);
DECK.slides.push(s);});
SI=DECK.slides.length-1;renderStage();save();
box.innerHTML=`✅ ${parsed.length} ${t('sumSlides')} — ${t('aiApplied')}`;
}else if(kind==='layout'){
const s=cur();if(!s){toast(t('needText'));return;}
const sug=suggestLayout({bullets:(s.blocks.body||'').replace(/<[^>]*>/g,' ').split(/[•\n]/).map(x=>x.trim()).filter(Boolean),img:!!s.blocks.img});
box.innerHTML=`${t('layoutSug')}: <b>${sug}</b> <button class="abtn" onclick="setLayout('${sug}')">${t('aiApplied')}</button>`;
}else if(kind==='notes'){
const s=cur();if(!s){toast(t('needText'));return;}
const txt=(s.blocks.body||'').replace(/<[^>]*>/g,'\n');
const bl=txt.split('\n').map(x=>x.trim()).filter(x=>x.length>3);
const gen=expandNotes({bullets:bl.length?bl:[s.blocks.title||'']});
s.notes=(s.notes?s.notes+'\n':'')+gen;document.getElementById('notesIn').value=s.notes;save();
box.innerHTML=`${t('notesGen')}:<br>`+esc(gen).slice(0,600);
}else if(kind==='wordy'){
const tx=(document.getElementById('stage').innerText||'');
const ss=tx.split(/[.!?]+/).map(x=>x.trim()).filter(Boolean);
const avg=ss.length?tx.split(/\s+/).length/ss.length:0;
box.innerHTML=avg>25?`⚠️ ${avg.toFixed(0)} words/sentence — ${t('wordyBad')}`:`✅ ${avg.toFixed(0)} — ${t('wordyOk')}`;
}
}
function renderDonate(){
document.getElementById('btcA').textContent=CONFIG.pay.btc;
document.getElementById('usdtA').textContent=CONFIG.pay.usdt;
}
function loadAds(){const A=CONFIG.ads,el=document.getElementById('adFoot');if(!el)return;
if(A.client){el.innerHTML='<ins class="adsbygoogle" style="display:block" data-ad-client="'+A.client+'" data-ad-slot="'+(A.slot||'')+'" data-ad-format="auto"></ins>';
if(!document.querySelector('script[src*="adsbygoogle"]')){const s=document.createElement('script');s.async=true;s.src='https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client='+A.client;s.crossOrigin='anonymous';document.head.appendChild(s);}try{(window.adsbygoogle=window.adsbygoogle||[]).push({});}catch(e){}}
else if(A.carbonServe){el.innerHTML='';const s=document.createElement('script');s.async=true;s.id='_carbonads_js';s.src='//cdn.carbonads.com/carbon.js?serve='+A.carbonServe+'&placement='+A.carbonPlacement;el.appendChild(s);}}
let PI=0;
function startPresent(){syncStage();if(!DECK.slides.length)return;PI=0;showP();document.getElementById('present').classList.add('show');}
function showP(){
const s=DECK.slides[PI];if(!s)return;
const el=document.getElementById('pslide');
el.innerHTML=slideHTML(s,true).replace('class="slide','class="pslide-in"');
document.getElementById('pnum').textContent=(PI+1)+' / '+DECK.slides.length;
document.getElementById('pbar').style.width=((PI+1)/DECK.slides.length*100)+'%';
const tr=DECK.trans||'fade';
el.style.animation='none';void el.offsetWidth;
el.style.animation=tr==='none'?'':(tr==='slide'?'pslide .35s':tr==='zoom'?'pzoom .35s':'pfade .35s');
}
function pNext(e){if(e)e.stopPropagation();if(PI<DECK.slides.length-1){PI++;showP();}}
function pPrev(){if(PI>0){PI--;showP();}}
document.addEventListener('keydown',e=>{
const p=document.getElementById('present');
if(!p.classList.contains('show'))return;
if(e.key==='ArrowRight'||e.key===' '||e.key==='Enter'){pNext();e.preventDefault();}
if(e.key==='ArrowLeft')pPrev();
if(e.key==='Escape')p.classList.remove('show');
});
const _ss=document.createElement('style');_ss.textContent='@keyframes pfade{from{opacity:0}to{opacity:1}}@keyframes pslide{from{transform:translateX(60px);opacity:0}to{transform:none;opacity:1}}@keyframes pzoom{from{transform:scale(.92);opacity:0}to{transform:none;opacity:1}}';document.head.appendChild(_ss);
function closeModal(){document.getElementById('dlModal').classList.remove('show');}
function dl(kind){
syncStage();
const title=(DECK.title||'baran-ppt').replace(/[^\w\- ]+/g,'').trim()||'baran-ppt';
if(kind==='json'){const b=new Blob([JSON.stringify(DECK)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=title+'.json';a.click();}
else if(kind==='txt'){const b=new Blob([document.getElementById('stage').innerText||''],{type:'text/plain'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=title+'.txt';a.click();}
else{dlHTML();return;}
toast(t('dlDone'));
}
function dlHTML(){
syncStage();
const css='.slide{background:#fff;color:#111;aspect-ratio:16/9;padding:36px 44px;margin:0 auto 18px;max-width:900px;border:1px solid #ccc}.cols{display:flex;gap:20px}.cols>div{flex:1}img{max-width:100%}table{border-collapse:collapse}td,th{border:1px solid #999;padding:5px 10px}';
const h='<!DOCTYPE html><html><head><meta charset="utf-8"><title>'+DECK.title+'</title><style>'+css+'</style></head><body>'+DECK.slides.map(s=>slideHTML(s,true)).join('')+'</body></html>';
document.getElementById('dlPre').textContent=h.slice(0,3000)+'…';
document.getElementById('dlModal').classList.add('show');
const b=new Blob([h],{type:'text/html'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='baran-ppt.html';a.click();
}
function impJSON(el){const f=el.files&&el.files[0];if(!f)return;const r=new FileReader();
r.onload=()=>{try{const d=JSON.parse(r.result);if(d&&d.slides){DECK=d;SI=0;renderStage();save();toast(t('dlDone'));}}catch(e){}};r.readAsText(f);el.value='';}
function doPrint(){syncStage();document.getElementById('printAll').innerHTML=DECK.slides.map(s=>slideHTML(s,true)).join('');window.print();}
function toggleTheme(){document.body.classList.toggle('light');}
function loadDeck(){
try{const d=JSON.parse(localStorage.getItem('bp_deck'));if(d&&d.slides&&d.slides.length){DECK=d;SI=Math.min(+localStorage.getItem('bp_si')||0,d.slides.length-1);return;}}catch(e){}
DECK=blankDeck();DECK.slides.push(Object.assign(mkSlide('title'),{blocks:{title:'Baran PowerPoint',body:'<p>Click a block to edit. Use AI to build decks from outlines.</p>',notes:'Welcome!'}}));SI=0;
}
loadDeck();setLang('en');loadAds();renderDonate();buildThemeSel();renderStage();
</script>
